# XcodeGen の定義。Kotozute.xcodeproj はここから生成するため git 管理しない
# （生成物をコミットすると、Xcode が触るたびに巨大な差分が出てレビューできなくなる）。
#   xcodegen generate
name: Kotozute
options:
  bundleIdPrefix: dev.kotozute
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  KotozuteAPI:
    path: KotozuteAPI

targets:
  Kotozute:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: KotozuteAPI
        product: KotozuteAPI
      - package: KotozuteAPI
        product: KotozuteAuth
    # Info.plist は自動生成に任せず明示する。
    # INFOPLIST_KEY_UILaunchScreen_Generation に任せると UILaunchScreen が入れ子で
    # 二重に書き出され、iOS が互換モードと判断して画面が letterbox 表示になる。
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ことづて
        # 空の辞書で「SwiftUI 標準のローンチスクリーンを使う」の意味になる。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # 付箋の色を活かしたいのでライト固定にする。ダーク対応は後で検討。
        UIUserInterfaceStyle: Light
        # 招待リンク用の独自スキーム（kotozute://invite/<token>）。
        # Universal Links にはドメインと apple-app-site-association が要るため、
        # まずは独自スキームで通す。
        CFBundleURLTypes:
          - CFBundleURLName: dev.kotozute.app.invite
            CFBundleURLSchemes: [kotozute]
    # path だけを書くと、XcodeGen が生成のたびに空の <dict/> で上書きする。
    # 鍵は properties に書いて XcodeGen 自身に生成させる。
    # aps-environment が抜けると、端末は「有効な aps-environment が無い」と言って
    # APNs への登録に失敗する。
    entitlements:
      path: App/Kotozute.entitlements
      properties:
        # 実機での開発用。App Store 配布時は production になる。
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kotozute.app
        # 署名の設定もここに書く。xcodeproj は xcodegen で作り直すので、
        # Xcode の画面で選んだチームは再生成のたびに消える。
        # チームが無いと Xcode は「Sign to Run Locally」に落ち、
        # entitlements が適用されない（aps-environment が入らず通知が登録できない）。
        DEVELOPMENT_TEAM: 5V6S74G5N9
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone のみ。
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
